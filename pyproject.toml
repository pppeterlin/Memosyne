[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memosyne"
version = "1.5.0"
description = "Local-first personal memory for AI agents: a Markdown vault, an ingest pipeline, and an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["memory", "mcp", "personal-knowledge", "rag", "local-first"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Core: ingest, enrich, digest, keyword search, MCP server.
dependencies = [
    # The server is written against the 1.x FastMCP API; 2.x renamed it.
    "mcp>=1.0,<2",
    "numpy>=1.26; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
# Dense vector retrieval (adds ~1 GB: torch + sentence-transformers + ChromaDB).
search = [
    "chromadb>=1.5",
    # Python < 3.13 stays on the long-tested line (torch 2.2, built against
    # NumPy 1.x). Newer Pythons need releases that ship wheels for them.
    "torch>=2.2,<2.3; python_version < '3.13'",
    "sentence-transformers>=2.7,<3; python_version < '3.13'",
    "transformers>=4.40,<4.42; python_version < '3.13'",
    "numpy<2; python_version < '3.13'",
    "onnxruntime<1.24; python_version < '3.13'",
    "torch>=2.6; python_version >= '3.13'",
    "sentence-transformers>=5; python_version >= '3.13'",
    "transformers>=4.57; python_version >= '3.13'",
    "onnxruntime>=1.24; python_version >= '3.14'",
]
# Experimental features under memosyne.labs (graph, RAG chat, …).
labs = [
    "kuzu>=0.11",
    "networkx>=3.0",
    "pandas>=1.5",
    "flashrank>=0.2",
    "google-genai>=1.0",
]
# Local LLM runtime client.
ollama = ["ollama>=0.6"]
all = ["memosyne[search,labs,ollama]"]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/pppeterlin/Memosyne"

[project.scripts]
memosyne = "memosyne.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memosyne = ["templates/*.md", "skills/*.md", "skills/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
