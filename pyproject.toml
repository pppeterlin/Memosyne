[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memosyne"
version = "0.4.0"
description = "Local-first personal memory infrastructure"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "chromadb>=1.5",
    "flashrank>=0.2",
    "google-genai>=1.0",
    "kuzu>=0.11",
    "mcp>=1.0",
    "networkx>=3.0",
    "numpy<2",
    "ollama>=0.6",
    "openai>=1.0",
    "pandas>=1.5",
    "python-dotenv>=1.0",
    "python-snappy>=0.7",
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
    "sentence-transformers==2.7.0",
    "torch==2.2.2",
    "transformers==4.40.0",
    "watchdog>=6.0",
    "onnxruntime<1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
memosyne = "memosyne:main"

[tool.setuptools]
py-modules = ["memosyne"]
