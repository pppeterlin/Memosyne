name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    # The core install has no torch / ChromaDB, so this job is fast and proves
    # the keyword-only path works end to end on every supported Python.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Invariants + unit tests
        run: make verify
      - name: Sample vault end to end (keyword search)
        run: memosyne quickstart
      - name: MCP smoke test
        run: python tests/test_mcp_smoke.py
