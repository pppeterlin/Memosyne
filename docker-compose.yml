# Memosyne Docker Compose
#
#   docker compose run --rm memosyne init
#   docker compose run --rm memosyne ingest
#   docker compose run --rm memosyne search "what was I doing last March?"
#   docker compose run --rm -i memosyne mcp          # stdio MCP server
#   docker compose --profile local-llm up -d ollama  # optional local LLM
#
# ./data on the host holds everything personal: vault/, spring/ and .env.

services:
  memosyne:
    build: .
    image: memosyne
    env_file:
      - path: ./data/.env
        required: false
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    volumes:
      - ./data:/data
      - memosyne-models:/root/.cache/huggingface
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - memosyne-ollama-models:/root/.ollama

volumes:
  memosyne-models:
  memosyne-ollama-models:
